<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="lgL" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" style="stop-color:#EF3B36"/>
      <stop offset="100%" style="stop-color:#C0150E"/>
    </linearGradient>
    <linearGradient id="lgR" x1="100%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" style="stop-color:#EF3B36"/>
      <stop offset="100%" style="stop-color:#C0150E"/>
    </linearGradient>
    <linearGradient id="lgIL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B0C08"/>
      <stop offset="100%" style="stop-color:#4A0604"/>
    </linearGradient>
    <linearGradient id="lgIR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7B0C08"/>
      <stop offset="100%" style="stop-color:#4A0604"/>
    </linearGradient>
    <filter id="ds">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#00000040"/>
    </filter>
  </defs>
  <g filter="url(#ds)">
    <!-- Left outer leg (bright red) -->
    <polygon points="6,82 22,82 22,26 50,58 50,42 22,10 6,10" fill="url(#lgL)"/>
    <!-- Left inner fold (dark red) -->
    <polygon points="22,26 50,58 50,42 22,10" fill="url(#lgIL)"/>
    <!-- Right inner fold (dark red) -->
    <polygon points="78,26 50,58 50,42 78,10" fill="url(#lgIR)"/>
    <!-- Right outer leg (bright red) -->
    <polygon points="94,82 78,82 78,26 50,58 50,42 78,10 94,10" fill="url(#lgR)"/>
  </g>
</svg>
